# picom (X11 compositor): animations, shadows, rounded corners, blur.
# Needs picom 12+ (`rules` and `animations`); Debian 13 ships it.
# Started by ~/.config/xmonad/autostart. Edit and run `pkill picom; picom -b`
# to apply (super+alt+w does not restart it).

backend = "glx";
vsync = true;
# never unredirect: fullscreen games/videos would flicker on toggle
unredir-if-possible = false;

# ---- shadows / corners / blur -----------------------------------------------
shadow = true;
shadow-radius = 18;
shadow-opacity = 0.45;
shadow-offset-x = -14;
shadow-offset-y = -10;
shadow-color = "#000000";

corner-radius = 12;

# blur behind translucent windows (wezterm is 0.9 opaque)
blur-background = true;
blur: {
  method = "dual_kawase";
  strength = 6;
};

# fading for everything the animations below do not cover
fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;
fade-delta = 6;

# ---- animations -------------------------------------------------------------
# Only for real application windows (the first rule below): open/close zoom
# in/out, and since xmonad maps/unmaps windows when it switches workspaces,
# workspace changes animate too. geometry: windows glide to their new place
# and size when the layout changes. Menus, tooltips, the bar and selection
# rectangles (slop resizes its window constantly) just fade.

# ---- per-window rules -------------------------------------------------------
rules = (
  { match = "(window_type = 'normal' || window_type = 'dialog') && !override_redirect";
    animations = (
      { triggers = [ "open", "show" ]; preset = "appear"; scale = 0.9; duration = 0.2; },
      { triggers = [ "close", "hide" ]; preset = "disappear"; scale = 0.9; duration = 0.15; },
      { triggers = [ "geometry" ]; preset = "geometry-change"; duration = 0.22; }
    ); },
  # quickshell bar: draws its own rounded islands on a transparent window
  { match = "window_type = 'dock'"; shadow = false; corner-radius = 0;
    blur-background = false; },
  # launcher overlay: full screen, no frame, a quick fade only
  { match = "name = 'qs-launcher' || name = 'qs-help' || name = 'qs-clip'"; shadow = false; corner-radius = 0;
    animations = (
      { triggers = [ "open", "show" ]; preset = "appear"; scale = 1.0; duration = 0.12; },
      { triggers = [ "close", "hide" ]; preset = "disappear"; scale = 1.0; duration = 0.1; }
    ); },
  # menus / tooltips / notifications: small radius, no zoom
  { match = "window_type = 'tooltip' || window_type = 'popup_menu' || window_type = 'dropdown_menu' || window_type = 'menu'";
    shadow = false; corner-radius = 8; blur-background = false; },
  { match = "class_g = 'Dunst'"; corner-radius = 10; },
  # selection rectangles (slop, flameshot) must stay exact
  { match = "class_g = 'slop' || class_g = 'flameshot'"; shadow = false;
    corner-radius = 0; blur-background = false; fade = false; },
  # fullscreen: square corners, no shadow
  { match = "fullscreen"; corner-radius = 0; shadow = false; }
);
